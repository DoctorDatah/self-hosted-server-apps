schema_version: 1
aliases:
  - alias: n8n-vm-setup
    target_selector: target_id=n8n-vm
    default_stages: [vm_install, app_deploy, cloudflare_vm_access, cloudflare_app_access]
    default_params:
      app_deploy:
        section: all
    requires_confirmation: true
    description: Full install+deploy+cloudflare setup for n8n VM.

  - alias: manual-vm-setup
    target_selector: target_id=manual-app-vm
    default_stages: [vm_install, app_deploy, cloudflare_vm_access, cloudflare_app_access]
    default_params:
      app_deploy:
        section: all
    requires_confirmation: true
    description: Full setup for manual app VM.

  - alias: install-app-tier
    target_selector: group=app-tier
    default_stages: [vm_install]
    default_params: {}
    requires_confirmation: true
    description: Run installation stage for all app-tier VMs.

  - alias: restore-n8n-staging
    target_selector: target_id=n8n-vm
    default_stages: [restore_app]
    default_params:
      restore_app:
        restore_target_type: staging
    requires_confirmation: true
    description: Restore n8n app to staging destination.
