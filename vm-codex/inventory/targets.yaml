schema_version: 1
targets:
  - target_id: proxmox-home
    target_type: proxmox_host
    role: proxmox-host
    env: prod
    host: localhost
    labels: [proxmox, host, prod]
    enabled_stages: [vm_install]
    base_profile: default
    role_overlay: proxmox-host
    target_overlay: proxmox-home
    vars:
      install_profile: manual-app-deploy

  - target_id: manual-app-vm
    target_type: vm
    role: app-vm
    env: stage
    host: localhost
    labels: [vm, app-tier, stage]
    enabled_stages: [vm_install, app_deploy, cloudflare_vm_access, cloudflare_app_access, backup_app, restore_app]
    base_profile: default
    role_overlay: app-vm
    target_overlay: manual-app-vm
    vars:
      install_profile: manual-app-deploy
      compose_file: "VM - Manual App Deployment (Inside VM)/Coolify/docker-compose.yml"
      cloudflare_vm_compose_file: "VM - Manual App Deployment (Inside VM)/Cloudflare/docker-compose.yml"
      cloudflare_app_compose_file: "VM - Manual App Deployment (Inside VM)/Cloudflare/docker-compose.yml"
      backup_sources:
        - /data/coolify
      restore_root: /tmp/vm-codex-restore/manual-app-vm

  - target_id: n8n-vm
    target_type: vm
    role: n8n-vm
    env: prod
    host: localhost
    labels: [vm, n8n-tier, app-tier, prod]
    enabled_stages: [vm_install, app_deploy, cloudflare_vm_access, cloudflare_app_access, backup_app, restore_app]
    base_profile: default
    role_overlay: app-vm
    target_overlay: n8n-vm
    vars:
      install_profile: manual-app-deploy
      compose_file: "VM - N8N/Coolify/docker-compose.yml"
      cloudflare_vm_compose_file: "VM - N8N/Cloudflare for VM/docker-compose.yml"
      cloudflare_app_compose_file: "VM - N8N/Cloudflare/docker-compose.yml"
      backup_sources:
        - /var/lib/n8n
        - /var/lib/n8n/postgres
      restore_root: /tmp/vm-codex-restore/n8n-vm

groups:
  - name: all-vms
    match_labels_all: [vm]
  - name: proxmox-hosts
    match_labels_all: [proxmox]
  - name: app-tier
    match_labels_all: [app-tier]
  - name: n8n-tier
    match_labels_all: [n8n-tier]
