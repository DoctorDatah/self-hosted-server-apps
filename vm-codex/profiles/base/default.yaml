schema_version: 1
name: default
stage_config:
  vm_install:
    risk: medium
    preflight:
      required_files: [vm-codex/installation/install_all.sh]
    commands:
      - "./vm-codex/installation/install_all.sh --profile {install_profile}{install_only_suffix}"

  app_deploy:
    risk: medium
    preflight:
      required_files: ["{compose_file}"]
    commands_by_section:
      infra:
        - "./vm-codex/runtime/stages/app_deploy.sh --compose-file '{compose_file}' --section infra"
      app:
        - "./vm-codex/runtime/stages/app_deploy.sh --compose-file '{compose_file}' --section app"
      post:
        - "./vm-codex/runtime/stages/app_deploy.sh --compose-file '{compose_file}' --section post"
      all:
        - "./vm-codex/runtime/stages/app_deploy.sh --compose-file '{compose_file}' --section all"

  cloudflare_vm_access:
    risk: medium
    preflight:
      required_files: ["{cloudflare_vm_compose_file}"]
    commands:
      - "./vm-codex/runtime/stages/cloudflare_setup.sh --compose-file '{cloudflare_vm_compose_file}' --mode vm_access --action up"

  cloudflare_app_access:
    risk: medium
    preflight:
      required_files: ["{cloudflare_app_compose_file}"]
    commands:
      - "./vm-codex/runtime/stages/cloudflare_setup.sh --compose-file '{cloudflare_app_compose_file}' --mode app_access --action up"

  backup_app:
    risk: high
    preflight:
      required_files: []
    commands:
      - "./vm-codex/runtime/stages/backup_app.sh --target '{target_id}' --backup-root 'vm-codex/local-state/backups' --sources '{backup_sources_csv}'"

  restore_app:
    risk: high
    preflight:
      required_files: []
    commands:
      - "./vm-codex/runtime/stages/restore_app.sh --target '{target_id}' --backup-root 'vm-codex/local-state/backups' --restore-root '{restore_root}' --restore-target-type '{restore_target_type}'"
