<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "vm-managment-app" }}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav">
      <div class="brand">
        <div class="brand-badge">VM</div>
        <div>
          <h1>vm-managment-app</h1>
          <p>Local config editor</p>
        </div>
      </div>

      <nav>
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/machines" class="nav-link {% if request.url.path.startswith('/machines') %}active{% endif %}">Machines</a>
        <a href="/operations" class="nav-link {% if request.url.path.startswith('/operations') %}active{% endif %}">Operations</a>
        <a href="/rules" class="nav-link {% if request.url.path.startswith('/rules') %}active{% endif %}">Env Rules</a>
      </nav>

      <div class="side-note">
        <h3>Source Of Truth</h3>
        <p>All edits are written back into <code>vm-configs/*.yaml</code>.</p>
      </div>
    </aside>

    <section class="content-area">
      <header class="top-bar">
        <div>
          <h2>{{ page_title or "Dashboard" }}</h2>
          <p id="top-status-text">Loading repo status...</p>
        </div>
        <div class="pill-row">
          <span class="pill" id="pill-branch">branch: -</span>
          <span class="pill" id="pill-changes">changes: -</span>
          <span class="pill" id="pill-validation">validation: -</span>
        </div>
      </header>

      <main class="page-content">
        <div id="flash-area"></div>
        {% block content %}{% endblock %}
      </main>
    </section>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-overlay" data-close-drawer="true"></div>
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3 id="drawer-title">Editor</h3>
        <button type="button" class="btn ghost" data-close-drawer="true">Close</button>
      </div>
      <div id="drawer-body" class="drawer-body">
        <p>Loading...</p>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
