<div class="preview-block">
  <h4>{{ title }}</h4>

  {% if errors %}
    <div class="flash error">
      <strong>Validation errors:</strong>
      <ul class="simple-list">
        {% for err in errors %}
          <li>{{ err }}</li>
        {% endfor %}
      </ul>
    </div>
  {% else %}
    <div class="flash success">No validation errors found in preview.</div>
  {% endif %}

  <pre class="diff-view">{{ diff_text }}</pre>
</div>
