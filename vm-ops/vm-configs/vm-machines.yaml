{
  "machines": {
    "n8n-stage-1": {
      "type": "app-vm",
      "parrent": "n8n-app",
      "env": "stage",
      "labels": [
        "n8n",
        "app",
        "cloudflare"
      ],
      "groups": [
        "n8n-stage"
      ],
      "enabled_setups": [
        "app_deploy",
        "backup_app",
        "cleanup_vm",
        "cloudflare_app_access",
        "cloudflare_vm_access",
        "repo_clone_or_update",
        "restore_app",
        "vm_install"
      ],
      "exec_mode": "vm-local",
      "repo_path": "/opt/vm-ops",
      "ssh": {
        "host": "10.10.0.20",
        "user": "ubuntu",
        "port": 22,
        "key_ref": "infisical://vm-codex/ssh/n8n-stage-1"
      },
      "params": {
        "app_id": "n8n",
        "public_hostname": "n8n-stage.example.com"
      },
      "defaults": {
        "docker": {
          "install": true
        },
        "logging": {
          "level": "info"
        },
        "packages": [
          "curl",
          "git",
          "docker.io"
        ],
        "repo": {
          "branch": "main",
          "path": "/opt/vm-ops"
        },
        "runtime": {
          "shell": "bash"
        }
      },
      "set_of_operations": {
        "n8n-vm-install": {
          "setups": [
            "repo_clone_or_update",
            "vm_install",
            "cloudflare_vm_access"
          ],
          "params": {},
          "requires_confirmation": true,
          "description": "Prepare the n8n staging VM for operations"
        },
        "n8n-app-restore-staging": {
          "setups": [
            "restore_app"
          ],
          "params": {
            "app_id": "n8n"
          },
          "requires_confirmation": true,
          "description": "Restore n8n in staging from backup"
        }
      },
      "status": "active"
    },
    "n8n-prod-1": {
      "type": "app-vm",
