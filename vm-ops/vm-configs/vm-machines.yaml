        "packages": [
          "curl",
          "git",
          "docker.io"
        ],
        "repo": {
          "branch": "main",
          "path": "/opt/vm-ops"
        },
        "runtime": {
          "shell": "bash"
        }
      },
      "set_of_operations": {
        "n8n-app-deploy": {
          "setups": [
            "repo_clone_or_update",
            "app_deploy"
          ],
          "params": {
            "app_id": "n8n"
          },
          "requires_confirmation": true,
          "description": "Deploy n8n app layer to production"
        },
        "n8n-app-backup": {
          "setups": [
            "backup_app"
          ],
          "params": {
            "app_id": "n8n"
          },
          "requires_confirmation": true,
          "description": "Backup n8n production state"
        }
