{
  "app_id": "coolify",
  "default_target_group": "coolify-prod",
  "deploy_stage_params": {
    "compose_file": "docker-compose.yml",
    "health_timeout": 180
  },
  "backup_stage_params": {
    "backup_paths": ["/data/coolify"],
    "include_db": true
  },
  "restore_stage_params": {
    "allowed_environments": ["stage"]
  },
  "health_checks": [
    {
      "type": "http",
      "url": "https://coolify.example.com/healthz"
    }
  ],
  "artifacts_policy": {
    "retain_logs": true,
    "retain_manifests": true
  }
}
