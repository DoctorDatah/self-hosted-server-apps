{
  "targets": {
    "n8n-stage-1": {
      "target_type": "vm",
      "environment": "stage",
      "labels": ["n8n", "app", "cloudflare"],
      "enabled_stages": [
        "repo_clone_or_update",
        "vm_install",
        "cloudflare_vm_access",
        "cloudflare_app_access",
        "app_deploy",
        "cleanup_vm",
        "backup_app",
        "restore_app"
      ],
      "base_profile": "default",
      "role_overlay": "n8n-app-vm",
      "target_overlay": "n8n-stage-1",
      "exec_mode": "local",
      "repo_path": "/opt/vm-codex-v2",
      "ssh": {
        "host": "10.10.0.20",
        "user": "ubuntu",
        "port": 22,
        "key_ref": "infisical://vm-codex/ssh/n8n-stage-1"
      },
      "vars": {
        "app_id": "n8n"
      }
    },
    "n8n-prod-1": {
      "target_type": "vm",
      "environment": "prod",
      "labels": ["n8n", "app", "prod"],
      "enabled_stages": [
        "repo_clone_or_update",
        "app_deploy",
        "backup_app"
      ],
      "base_profile": "default",
      "role_overlay": "n8n-app-vm",
      "target_overlay": "n8n-prod-1",
      "exec_mode": "ssh",
      "repo_path": "/opt/vm-codex-v2",
      "ssh": {
        "host": "10.10.0.30",
        "user": "ubuntu",
        "port": 22,
        "key_ref": "infisical://vm-codex/ssh/n8n-prod-1"
      },
      "vars": {
        "app_id": "n8n"
      }
    },
    "coolify-prod-1": {
      "target_type": "vm",
      "environment": "prod",
      "labels": ["coolify", "app", "prod"],
      "enabled_stages": [
        "repo_clone_or_update",
        "app_deploy",
        "backup_app"
      ],
      "base_profile": "default",
      "role_overlay": "coolify-app-vm",
      "target_overlay": "coolify-prod-1",
      "exec_mode": "ssh",
      "repo_path": "/opt/vm-codex-v2",
      "ssh": {
        "host": "10.10.0.40",
        "user": "ubuntu",
        "port": 22,
        "key_ref": "infisical://vm-codex/ssh/coolify-prod-1"
      },
      "vars": {
        "app_id": "coolify"
      }
    }
  }
}
