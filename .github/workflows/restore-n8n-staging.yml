name: restore-n8n-staging

on:
  workflow_dispatch:
    inputs:
      backup_id:
        required: true
        type: string

jobs:
  restore:
    uses: ./.github/workflows/_vm-codex-v2-execute.yml
    with:
      operation: run
      alias: n8n-app-restore-staging
      params_json: ${{ format('{{"backup_id":"{0}"}}', inputs.backup_id) }}
      exec_mode: ssh
      environment: stage
