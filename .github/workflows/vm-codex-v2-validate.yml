name: vm-codex-v2-validate

on:
  pull_request:
    paths:
      - 'vm-v1/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vm-v1
    steps:
      - uses: actions/checkout@v4
      - name: Quick validate
        run: python3 tools/quick_validate.py
      - name: Runtime doctor
        run: ./runtime/vmcx doctor --ci
